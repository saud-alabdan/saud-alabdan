<body>
<x-dc>
<helmet>
  <title>تواصل — سعود العبدان</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="./config/site.config.js"></script>
  <style>
    html { scroll-behavior: smooth; }
    body { margin: 0; background: oklch(0.975 0.006 75); direction: rtl; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; text-rendering: optimizeLegibility; }
    * { box-sizing: border-box; }
    ::selection { background: oklch(0.52 0.1 70 / 0.25); }
    a.email-link { color: oklch(0.16 0.012 75); }
    a.email-link:hover { color: oklch(0.52 0.1 70); }
  </style>
</helmet>

<div ref="{{ setRootRef }}" dir="rtl" lang="ar" style="font-family:'IBM Plex Sans Arabic', sans-serif; color:oklch(0.16 0.012 75); background:oklch(0.975 0.006 75); width:100%; overflow-x:hidden; min-height:100vh; display:flex; flex-direction:column;">

  {{ siteHeader }}

  <section data-reveal="up" style="flex:1; display:flex; align-items:center; max-width:1000px; margin:0 auto; padding:clamp(60px,10vw,120px) clamp(20px,6vw,64px); text-align:center; opacity:0; transform:translateY(16px); transition:opacity 1s cubic-bezier(0.22,0.61,0.36,1), transform 1s cubic-bezier(0.22,0.61,0.36,1); width:100%;">
    <div style="margin:0 auto;">
      <div style="font-size:14px; letter-spacing:0; font-weight:500; color:oklch(0.52 0.1 70); margin-bottom:20px;">تواصل</div>
      <h1 style="font-weight:600; font-size:clamp(30px,4.6vw,48px); line-height:1.32; margin:0 0 24px; text-wrap:pretty;">لنبدأ بخطوة واضحة</h1>
      <p style="font-size:clamp(16px,1.6vw,19px); line-height:1.9; color:oklch(0.4 0.012 75); max-width:560px; margin:0 auto 48px;">راسلني مباشرة عبر البريد الإلكتروني لتحديد موعد الجلسة الاستشارية الأولى.</p>
      <a class="email-link" href="{{ contactEmailHref }}" style="display:inline-block; font-weight:600; font-size:clamp(22px,3vw,30px); text-decoration:none; border-bottom:1px solid oklch(0.85 0.01 75); padding-bottom:8px; transition:color .3s ease;">{{ contactEmail }}</a>
      <p style="font-size:14px; color:oklch(0.5 0.01 75); margin:40px 0 0;">{{ contactAddress }}</p>
    </div>
  </section>

  {{ siteFooter }}

</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { cfg: (typeof window !== 'undefined' && window.SITE) ? window.SITE : null };

  componentDidMount() { if (window.SiteChrome) window.SiteChrome.watch(this); }

  setRootRef = (el) => {
    if (!el || this.rootEl === el) return;
    this.rootEl = el;
    // Query the document (not the captured root): the DC runtime rebuilds the
    // template subtree when cfg arrives, so a stored root element goes stale.
    const pending = Array.from(document.querySelectorAll('[data-reveal]'));
    const reveal = (t) => { t.style.opacity = '1'; t.style.transform = 'none'; };
    const check = () => {
      const vh = window.innerHeight;
      for (let i = pending.length - 1; i >= 0; i--) {
        const r = pending[i].getBoundingClientRect();
        if (r.top < vh * 0.92) { reveal(pending[i]); pending.splice(i, 1); }
      }
      if (!pending.length) { window.removeEventListener('scroll', check); window.removeEventListener('resize', check); }
    };
    window.addEventListener('scroll', check, { passive: true });
    window.addEventListener('resize', check, { passive: true });
    check();
  };

  renderVals() {
    return Object.assign({ setRootRef: this.setRootRef }, window.SiteChrome ? window.SiteChrome.vals(this.state.cfg) : {});
  }
}
</script>
</body>
