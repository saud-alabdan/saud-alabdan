<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- CMS integration: apply saved CMS content over the config source, then the
     shared header/footer read from it. Must run before the runtime boots. -->
<script src="./config/supabase.config.js"></script>
<script src="./config/supabase-client.js"></script>
<script src="./config/cms-overlay.js"></script>
<script src="./support.js"></script>
<!-- Shared Header + Footer — the single source of the site chrome. -->
<script src="./config/site-chrome.js"></script>
<!-- Reusable content-card renderer (same single source as the homepage). -->
<script src="./config/content-cards.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <title>المقالات — سعود العبدان</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="./config/site.config.js"></script>
  <style>
    html { scroll-behavior: smooth; }
    body { margin: 0; background: #F7F5F2; direction: rtl; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; text-rendering: optimizeLegibility; }
    * { box-sizing: border-box; }
    ::selection { background: #A57A4C40; }
  </style>
</helmet>

<div ref="{{ setRootRef }}" dir="rtl" lang="ar" style="font-family:'IBM Plex Sans Arabic', sans-serif; color:#232323; background:#F7F5F2; width:100%; overflow-x:hidden; min-height:100vh; display:flex; flex-direction:column;">

  {{ siteHeader }}

  <main style="flex:1 1 auto;">
    <section data-reveal="up" style="max-width:1400px; margin:0 auto; padding:clamp(56px,8vw,110px) clamp(20px,6vw,64px) clamp(28px,4vw,44px); opacity:0; transform:translateY(16px); transition:opacity 1s cubic-bezier(0.22,0.61,0.36,1), transform 1s cubic-bezier(0.22,0.61,0.36,1);">
      <div style="font-size:14px; font-weight:500; color:#A57A4C; margin-bottom:18px;">المدونة</div>
      <h1 style="font-weight:600; font-size:clamp(32px,4.6vw,52px); line-height:1.28; margin:0; text-wrap:pretty;">المقالات</h1>
    </section>

    <section style="max-width:1400px; margin:0 auto; padding:0 clamp(20px,6vw,64px) clamp(72px,9vw,120px);">
      <sc-if value="{{ hasArticles }}">
        {{ articlesGrid }}
      </sc-if>
      <sc-if value="{{ noArticles }}">
        <p style="font-size:16px; line-height:1.9; color:#8A837A; padding:clamp(20px,4vw,48px) 0;">لا توجد مقالات منشورة بعد.</p>
      </sc-if>
    </section>
  </main>

  {{ siteFooter }}

</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { cfg: (typeof window !== 'undefined' && window.SITE) ? window.SITE : null };

  componentDidMount() { if (window.SiteChrome) window.SiteChrome.watch(this); }

  setRootRef = (el) => {
    if (!el || this.rootEl === el) return;
    this.rootEl = el;
    // Query the document (not the captured root): the DC runtime rebuilds the
    // template subtree when cfg arrives, so a stored root element goes stale.
    const pending = Array.from(document.querySelectorAll('[data-reveal]'));
    const reveal = (t) => { t.style.opacity = '1'; t.style.transform = 'none'; };
    const check = () => {
      const vh = window.innerHeight;
      for (let i = pending.length - 1; i >= 0; i--) {
        const r = pending[i].getBoundingClientRect();
        if (r.top < vh * 0.92) { reveal(pending[i]); pending.splice(i, 1); }
      }
      if (!pending.length) { window.removeEventListener('scroll', check); window.removeEventListener('resize', check); }
    };
    window.addEventListener('scroll', check, { passive: true });
    window.addEventListener('resize', check, { passive: true });
    check();
  };

  renderVals() {
    const c = this.state.cfg;
    const base = Object.assign({ setRootRef: this.setRootRef }, window.SiteChrome ? window.SiteChrome.vals(c) : {});
    const grid = (c && window.ContentCards) ? window.ContentCards.renderArticles(c) : null;
    base.articlesGrid = grid;
    base.hasArticles = !!grid;
    base.noArticles = !grid;
    return base;
  }
}
</script>
</body>
</html>
