<!DOCTYPE html>

  <title>سعود العبدان</title>
  <!-- Deployment entry point. The public site's home page is Home.dc.html
       (a complete DC document rendered by support.js). This root index.html

       changing the DC routing, or duplicating any content. Relative paths in
       Home.dc.html (./config/…, ./support.js) resolve from the site root. -->

  <meta http-equiv="refresh" content="0; url=./Home.dc.html">
  <script>location.replace('./Home.dc.html');</script>
  <style>
    html, body { margin: 0; height: 100%; background: #F7F5F2; color: #232323;
      font-family: 'IBM Plex Sans Arabic', system-ui, -apple-system, Segoe UI, sans-serif; }
    .fallback { display: flex; align-items: center; justify-content: center;
      min-height: 100vh; font-size: 16px; }
    .fallback a { color: #48553F; text-decoration: none; border-bottom: 1px solid #48553F; padding-bottom: 2px; }
  </style>
</head>
<body>
  <!-- Shown only if the automatic redirect is blocked (e.g. scripts disabled). -->

    <div class="fallback"><a href="./Home.dc.html">الانتقال إلى الصفحة الرئيسية</a></div>
  </noscript>
</body>
</html>
